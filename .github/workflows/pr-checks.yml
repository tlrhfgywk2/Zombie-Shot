name: Pull Request Checks

on:
  pull_request:
    branches:
      - develop
      - main
      - release

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 검사 리비전 기록
        run: git rev-parse HEAD

      - name: 전투 시험장 도메인·제어기 계약
        run: npm test -- src/prototype/combat.test.ts

      - name: Test
        run: npm test

      - name: Verify ammunition workbook matches runtime definitions
        run: npm run check:ammo-spec

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
